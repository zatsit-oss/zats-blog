name: Deploy to Firebase Hosting on PR
on:
  # Manual trigger, and not a convenience: on 29 August a force-push that
  # rewrote the branch's history left the preview three commits behind without
  # firing a single run, and there was no way to redeploy without inventing a
  # commit. `gh workflow run firebase-hosting-pull-request.yml --ref <branche>`
  # now does it.
  workflow_dispatch:

  pull_request:
    # blog/ and docs/ are gone: content is read from the content repository in
    # place, and this repo no longer holds a copy of it.
    paths-ignore:
      - "README.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "PLAN-MIGRATION.md"
      - "REPRISE.md"

concurrency:
  group: ${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    # Expose the secret as a job-level env var so it can be tested in step `if`
    # conditions. Secrets are not available to workflows triggered by Dependabot
    # or forks, so this is empty there and the deploy step is skipped (not failed).
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZATSIT_BLOG }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch content and build
        uses: ./.github/actions/astro
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # The build above is the blocking check. The preview deploy only runs when
      # the Firebase secret is present, so Dependabot/fork PRs stay green.
      - name: Deploy preview to Firebase Hosting
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ env.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: zatsit-blog
